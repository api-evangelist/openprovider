aid: openprovider
name: Openprovider
description: >-
  Openprovider is a wholesaler of Internet services and products with a unique
  platform from which you can find and manage all the products you need:
  domains, new gTLDs, SSL certificates, licenses for Plesk and Virtuozzo, spam
  filters, and more.
