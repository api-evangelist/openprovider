  domainRenewDomainResponse:
    type: object
    title: RenewDomainResponse
    properties:
      code:
        type: integer
        format: int32
        title: Response code
      data:
        title: Response data
        $ref: '#/definitions/domainRenewDomainResponseData'
      desc:
