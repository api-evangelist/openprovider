openapi: 3.2.0
info:
  title: REST Contact Service API
  version: 1.0.0-beta
servers:
- url: https://api.openprovider.eu
security:
- Bearer: []
tags:
- name: ContactService
  x-displayName: Contact
paths:
  /v1beta/contacts:
    get:
      tags:
      - ContactService
      summary: List contacts
      operationId: ListContacts
      parameters:
      - description: Output limit.
        name: limit
        in: query
        schema:
          type: integer
          format: int32
      - description: Output offset.
        name: offset
        in: query
        schema:
          type: integer
          format: int32
      - description: Output ordering pattern. ASC / DESC.
        name: order
        in: query
        schema:
          type: string
      - description: Order output by field (i.e. first_name).
        name: order_by
        in: query
        schema:
          type: string
      - description: Full or partial email address. Wildcard (*) can be used.
        name: email_pattern
        in: query
        schema:
          type: string
      - description: Full or partial last name. Wildcard (*) can be used.
        name: last_name_pattern
        in: query
        schema:
          type: string
      - description: Full or partial company name. Wildcard (*) can be used.
        name: company_name_pattern
        in: query
        schema:
          type: string
      - description: The username pattern.
        name: username_pattern
        in: query
        schema:
          type: string
      - description: Contact's role.
        name: role
        in: query
        schema:
          type: string
      - description: Retrieves objects with (1) or without (0) additional data.
        name: with_additional_data
        in: query
        schema:
          type: boolean
          format: boolean
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/contactListContactsResponse'
        default:
          description: (empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorError'
    post:
      tags:
      - ContactService
      summary: Create contact
      operationId: CreateContact
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/contactCreateContactResponse'
        default:
          description: (empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/contactCreateContactRequest'
        required: true
  /v1beta/contacts/{id}:
    get:
      tags:
      - ContactService
      summary: Get contact
      operationId: GetContact
      parameters:
      - description: Object ID
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - description: Retrieves objects with (1) or without (0) additional data.
        name: with_additional_data
        in: query
        schema:
          type: boolean
          format: boolean
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/contactGetContactResponse'
        default:
          description: (empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorError'
    put:
      tags:
      - ContactService
      summary: Update contact
      operationId: UpdateContact
      parameters:
      - description: Object ID
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/contactUpdateContactResponse'
        default:
          description: (empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/contactUpdateContactRequest'
        required: true
    delete:
      tags:
      - ContactService
      summary: Delete contact
      operationId: DeleteContact
      parameters:
      - description: Object ID
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/contactDeleteContactResponse'
        default:
          description: (empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorError'
components:
  schemas:
    contactUpdateContactResponseData:
      type: object
      title: UpdateContactResponseData
      properties:
        success:
          type: boolean
          format: boolean
          title: Indicates if operation was successful
      example:
        success: false
    contactAddress:
      type: object
      title: Address
      properties:
        city:
          type: string
          title: City
        country:
          type: string
          title: Country code
        number:
          type: string
          title: Street number
        state:
          type: string
          title: State / province
        street:
          type: string
          title: Street
        suffix:
          type: string
          title: Address suffix
        zipcode:
          type: string
          title: Postal code
      example:
        city: Test city
        country: NL
        number: '123'
        state: Testprovince
        street: Test street
        suffix: A
        zipcode: 1235 XX
    contactGetContactResponse:
      type: object
      title: GetContactResponse
      properties:
        code:
          type: integer
          format: int32
          title: Response code
        data:
          title: Response data
